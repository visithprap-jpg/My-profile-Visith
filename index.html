<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แฟ้มสะสมผลงาน -  Portfolio</title>
    <!-- โหลด Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-5 flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-bold">นาย วิสิฐ ประพาฬ</h1>
                <!-- 📌 แก้ไขเนื้อหา นายอนันต์ชัย เพชรพันธ์  -->
                <p class="text-indigo-200 text-xs md:text-sm">Digital Business Technology & Cloud Educator</p>
                <!-- 📌 แก้ไขเนื้อหา Digital Business Technology & Cloud Educator  -->
            </div>
            <span class="bg-indigo-800 text-indigo-100 text-xs px-3 py-1.5 rounded-full border border-indigo-500 shadow-sm hidden sm:inline-block">
                Hosted on GitHub Pages
                <!-- 📌 แก้ไขเนื้อหา Hosted on GitHub Pages  -->
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow space-y-10">

        <!-- Section 1: ข้อมูลส่วนตัว (Profile & Intro) -->
        <section class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row items-center gap-8">
            <div class="relative flex-shrink-0">
                
                <!-- 📌 [จุดแทรกรูปที่ 1]: รูปโปรไฟล์ของคุณ -->
                <!-- วางไฟล์รูปไว้ที่: assets/images/profile.jpg -->
                <img id="profile-img" 
                     src="./assets/images/profile.jpg" 
                     alt="รูปโปรไฟล์ นายอนันต์ชัย เพชรพันธ์"
